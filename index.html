<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JVL All Care | Premium Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jvl: { dark: '#073430', primary: '#14b8a6', gold: '#d4af37' }
                    },
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { background: linear-gradient(135deg, #073430 0%, #115e59 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .radio-custom:checked + div { background-color: #d4af37; color: white; border-color: #d4af37; transform: scale(1.1); box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body class="py-10 px-4 text-gray-800">
    <div class="max-w-4xl mx-auto glass-card overflow-hidden">
        <!-- Header -->
        <div class="bg-jvl-dark text-white p-10 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-jvl-primary via-jvl-gold to-jvl-primary"></div>
            <h1 class="text-3xl md:text-4xl font-bold mb-3 tracking-wide"><span class="text-jvl-primary">JVL</span> All Care</h1>
            <p class="text-jvl-gold font-medium text-lg">Evaluation & Feedback</p>
        </div>

        <form id="evaluationForm" class="p-8 md:p-12 space-y-10">
            <!-- Section 1 -->
            <div>
                <h2 class="text-2xl font-bold text-jvl-dark border-b-2 border-jvl-gold pb-2 mb-6 inline-block">ส่วนที่ 1: ข้อมูลบุคลากร</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block font-semibold mb-2 text-gray-700">บทบาทหน้าที่ <span class="text-red-500">*</span></label>
                        <select name="role" required class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-jvl-primary transition">
                            <option value="">-- เลือกวิชาชีพ --</option>
                            <option value="แพทย์">แพทย์</option>
                            <option value="พยาบาล">พยาบาล</option>
                            <option value="เภสัชกร">เภสัชกร</option>
                            <option value="นักวิชาการคอมพิวเตอร์">นักวิชาการคอมพิวเตอร์</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-2 text-gray-700">ระดับการปฏิบัติงาน <span class="text-red-500">*</span></label>
                        <select name="level" required class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-jvl-primary transition">
                            <option value="">-- เลือกระดับ --</option>
                            <option value="ผู้บริหาร">ผู้บริหาร</option>
                            <option value="หัวหน้างาน">หัวหน้างาน</option>
                            <option value="ผู้ปฏิบัติ">ผู้ปฏิบัติ</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Section 2 -->
            <div>
                <h2 class="text-2xl font-bold text-jvl-dark border-b-2 border-jvl-gold pb-2 mb-2 inline-block">ส่วนที่ 2: ประเมินระบบ</h2>
                <p class="text-gray-500 mb-6 font-medium">(5 = ดีเยี่ยม, 1 = ต้องปรับปรุง)</p>
                <div id="ratingQuestions" class="space-y-8"></div>
                
                <div class="mt-8">
                    <label class="block font-semibold mb-3 text-gray-700 text-lg">ข้อเสนอแนะฟีเจอร์เพิ่มเติมที่ต้องการ</label>
                    <textarea name="q10" rows="3" class="w-full bg-gray-50 border border-gray-200 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-jvl-primary transition resize-none" placeholder="บอกเล่าไอเดียของคุณได้เลย..."></textarea>
                </div>
            </div>

            <div class="text-center pt-6">
                <button type="submit" id="submitBtn" class="bg-gradient-to-r from-jvl-dark to-jvl-primary text-white font-bold py-4 px-12 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition duration-300 text-lg">
                    ส่งข้อมูลการประเมิน
                </button>
            </div>
        </form>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9ZBiaBcERbd7PNbMPa3QjzGOy4X6C8V23TFBgQ1fUB4oCsi5wB-azEfrJKusmohxO/exec'; // ใส่ URL ของ GAS 
        const questions = [
            "UI Design: ความสวยงามและทันสมัยของหน้าจอ",
            "Layout Clarity: ความสะอาดตาและการจัดวางองค์ประกอบ",
            "User-Friendly: ความง่ายในการใช้งานระบบ",
            "Responsive: ความคล่องตัวบนมือถือ/แท็บเล็ต",
            "Performance: ความเร็วในการประมวลผล",
            "Efficiency: การลดการคีย์ข้อมูลซ้ำซ้อน",
            "Cognitive Load: การลดความสับสนในการทำงาน",
            "Value: ประโยชน์ของข้อมูลต่อการตัดสินใจ",
            "Feasibility: ความมั่นใจที่จะใช้แทนระบบเดิม"
        ];

        const qContainer = document.getElementById('ratingQuestions');
        questions.forEach((q, idx) => {
            let html = `<div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition"><p class="font-semibold text-lg mb-4 text-gray-800">${idx+1}. ${q}</p><div class="flex flex-wrap gap-4 justify-between sm:justify-start">`;
            for (let i = 5; i >= 1; i--) {
                html += `<label class="relative cursor-pointer"><input type="radio" name="q${idx+1}" value="${i}" required class="sr-only radio-custom"><div class="w-12 h-12 flex items-center justify-center rounded-full border-2 border-gray-200 text-gray-500 font-bold text-lg transition-all duration-200 hover:border-jvl-primary">${i}</div></label>`;
            }
            html += `</div></div>`;
            qContainer.innerHTML += html;
        });

        document.getElementById('evaluationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'กำลังประมวลผล...'; btn.disabled = true;
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(this))) })
            .then(() => { alert('บันทึกข้อมูลเรียบร้อย ขอบคุณครับ'); this.reset(); })
            .finally(() => { btn.innerHTML = 'ส่งข้อมูลการประเมิน'; btn.disabled = false; });
        });
    </script>
</body>
</html>
